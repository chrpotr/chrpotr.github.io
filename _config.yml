title: Chris Potter
description: Articles by Chris Potter
url: "https://chrpotr.github.io"
baseurl: ""
lang: en
author: Chris Potter
markdown: kramdown
permalink: /articles/:title/
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
twitter:
  card: summary_large_image
exclude:
  - README.md
  - ARTICLE_TEMPLATE.md
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card.png
        width: 1200
        height: 630
        alt: Articles by Chris Potter
  - scope:
      path: ""
      type: posts
    values:
      layout: post
